name: walsey_voice_speech
description: >-
  Offline speech recognition for Walsey (Stage 2). Implements the pure-Dart
  SpeechRecognizer port with Vosk, plus an explicit language-model setup flow.
  No cloud service, no paid API, no command execution.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.0
  crypto: ^3.0.7
  ffi: ^2.1.3
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.4
  record: ^7.1.2
  walsey_voice_core:
    path: ../walsey_voice_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
